name: m2

services:
  postgres:
    image: postgres:16-alpine
    container_name: m2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-consular}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./initdb/01-esquemas.sql:/docker-entrypoint-initdb.d/01-esquemas.sql:ro
      - m2_postgres_data:/var/lib/postgresql/data
    networks:
      - datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consular"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: m2-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-consular}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-consular}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - m2_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - frontal
      - datos
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: m2-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - frontal
      - datos
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

  citas-service:
    build:
      context: .
      dockerfile: citas-service/Dockerfile
    container_name: m2-citas
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${CITAS_DB_USER:-citas_app}
      DB_PASSWORD: ${CITAS_DB_PASSWORD:-citas_pwd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-consular}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-consular}
    ports:
      - "8081:8081"
    networks:
      - frontal
      - datos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  tramites-service:
    build:
      context: .
      dockerfile: tramites-service/Dockerfile
    container_name: m2-tramites
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${TRAMITES_DB_USER:-tramites_app}
      DB_PASSWORD: ${TRAMITES_DB_PASSWORD:-tramites_pwd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-consular}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-consular}
      GRPC_PORT: 9082
      FALLAS_INTERMITENTES_PORCENTAJE: ${FALLAS_INTERMITENTES_PORCENTAJE:-0}
    ports:
      - "8082:8082"
      - "9082:9082"
    networks:
      - frontal
      - datos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  pide-simulador:
    image: wiremock/wiremock:3.9.2
    container_name: m2-pide
    restart: unless-stopped
    mem_limit: 256m
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "8089:8080"
    volumes:
      - ./pide-simulador/mappings:/home/wiremock/mappings:ro
    networks:
      - frontal
      - datos
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/__admin/health >/dev/null || wget -qO- http://localhost:8080/__admin/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  identidad-service:
    build:
      context: .
      dockerfile: identidad-service/Dockerfile
    container_name: m2-identidad
    restart: unless-stopped
    mem_limit: 512m
    environment:
      PIDE_URL: ${PIDE_URL:-http://pide-simulador:8080}
    ports:
      - "8086:8086"
    networks:
      - frontal
      - datos
    depends_on:
      pide-simulador:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  notificaciones-service:
    build:
      context: .
      dockerfile: notificaciones-service/Dockerfile
    container_name: m2-notificaciones
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${NOTIFICACIONES_DB_USER:-notificaciones_app}
      DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-notificaciones_pwd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-consular}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-consular}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      NOTIFICACIONES_FALLAR_SIEMPRE: ${NOTIFICACIONES_FALLAR_SIEMPRE:-false}
    ports:
      - "8084:8084"
    networks:
      - frontal
      - datos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  pagos-service:
    build:
      context: .
      dockerfile: pagos-service/Dockerfile
    container_name: m2-pagos
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "8083:8083"
    networks:
      - frontal
      - datos
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  bff-web:
    build:
      context: .
      dockerfile: bff-web/Dockerfile
    container_name: m2-bff
    restart: unless-stopped
    mem_limit: 384m
    environment:
      CITAS_SERVICE_URL: http://citas-service:8081
      TRAMITES_SERVICE_URL: http://tramites-service:8082
      PAGOS_SERVICE_URL: http://pagos-service:8083
      NOTIFICACIONES_SERVICE_URL: http://notificaciones-service:8084
      IDENTIDAD_SERVICE_URL: http://identidad-service:8086
    ports:
      - "8085:8085"
    networks:
      - frontal
      - datos
    depends_on:
      citas-service:
        condition: service_healthy
      tramites-service:
        condition: service_healthy
      pagos-service:
        condition: service_healthy
      identidad-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: m2-gateway
    restart: unless-stopped
    mem_limit: 384m
    environment:
      CITAS_SERVICE_URL: http://citas-service:8081
      TRAMITES_SERVICE_URL: http://tramites-service:8082
      PAGOS_SERVICE_URL: http://pagos-service:8083
      NOTIFICACIONES_SERVICE_URL: http://notificaciones-service:8084
      IDENTIDAD_SERVICE_URL: http://identidad-service:8086
      BFF_WEB_URL: http://bff-web:8085
    ports:
      - "8080:8080"
    networks:
      - frontal
      - datos
    depends_on:
      bff-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

networks:
  frontal:
    name: m2_frontal
  datos:
    name: m2_datos

volumes:
  m2_postgres_data:
    name: m2_postgres_data
  m2_rabbitmq_data:
    name: m2_rabbitmq_data

