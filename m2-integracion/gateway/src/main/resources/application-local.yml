# Perfil 'local' para ejecución desde Eclipse en modo híbrido (regla 02)
spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: citas-route
            uri: http://localhost:8081
            predicates:
              - Path=/api/citas/**, /api/oficinas/**
          - id: tramites-route
            uri: http://localhost:8082
            predicates:
              - Path=/api/tramites/**
          - id: tarifas-pagos-route
            uri: http://localhost:8083
            predicates:
              - Path=/api/tarifas/**, /api/pagos/**
          - id: avisos-route
            uri: http://localhost:8084
            predicates:
              - Path=/api/avisos/**
          - id: identidad-route
            uri: http://localhost:8086
            predicates:
              - Path=/api/identidad/**
          - id: bff-route
            uri: http://localhost:8085
            predicates:
              - Path=/bff/**

