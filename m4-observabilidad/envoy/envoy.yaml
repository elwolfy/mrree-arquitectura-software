static_resources:
  listeners:
    - name: listener_tramites_sidecar
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: tramites_sidecar
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: tramites_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: tramites_cluster
                            timeout: 2s
                            retry_policy:
                              retry_on: "5xx,reset,connect-failure,retriable-4xx"
                              num_retries: 3
                              per_try_timeout: 1s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: tramites_cluster
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: tramites_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: tramites-service
                      port_value: 8082

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

