name: m4

x-otel-common: &otel-common
  JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://lgtm:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=laboratorio,service.namespace=consular"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRIC_EXPORT_INTERVAL: "5000"

services:
  postgres:
    image: postgres:16-alpine
    container_name: m4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-consular}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/initdb/01-esquemas.sql:/docker-entrypoint-initdb.d/01-esquemas.sql:ro
      - m4_postgres_data:/var/lib/postgresql/data
    networks:
      - datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consular"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: m4-redis
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "6379:6379"
    networks:
      - datos
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: m4-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-consular}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-consular}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - m4_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - frontal
      - datos
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: m4-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - frontal
      - datos
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

  lgtm:
    image: grafana/otel-lgtm:0.8.1
    container_name: m4-lgtm
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./grafana/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./grafana/provisioning/dashboards/consular-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/dashboards-consular:ro
    networks:
      - frontal
      - datos
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null || wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 25s
      retries: 15

  citas-service:
    build:
      context: .
      dockerfile: citas-service/Dockerfile
    container_name: m4-citas
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: citas-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${CITAS_DB_USER:-citas_app}
      DB_PASSWORD: ${CITAS_DB_PASSWORD:-citas_pwd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-consular}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-consular}
    ports:
      - "8081:8081"
    networks:
      - frontal
      - datos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 8

  tramites-service:
    build:
      context: .
      dockerfile: tramites-service/Dockerfile
    container_name: m4-tramites
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: tramites-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${TRAMITES_DB_USER:-tramites_app}
      DB_PASSWORD: ${TRAMITES_DB_PASSWORD:-tramites_pwd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-consular}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-consular}
      GRPC_PORT: 9082
      FALLAS_INTERMITENTES_PORCENTAJE: ${FALLAS_INTERMITENTES_PORCENTAJE:-0}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_CONSULTA_TRAMITE_TIPO: ${CACHE_CONSULTA_TRAMITE_TIPO:-nula}
      PAGOS_SERVICE_URL: http://pagos-service:8083
    ports:
      - "8082:8082"
      - "9082:9082"
    networks:
      - frontal
      - datos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 8

  pide-simulador:
    image: wiremock/wiremock:3.9.2
    container_name: m4-pide
    restart: unless-stopped
    mem_limit: 256m
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "8089:8080"
    volumes:
      - ./pide-simulador/mappings:/home/wiremock/mappings:ro
    networks:
      - frontal
      - datos
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/__admin/health >/dev/null || wget -qO- http://localhost:8080/__admin/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  identidad-service:
    build:
      context: .
      dockerfile: identidad-service/Dockerfile
    container_name: m4-identidad
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: identidad-service
      PIDE_URL: ${PIDE_URL:-http://pide-simulador:8080}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8086:8086"
    networks:
      - frontal
      - datos
    depends_on:
      pide-simulador:
        condition: service_healthy
      redis:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 8

  notificaciones-service:
    build:
      context: .
      dockerfile: notificaciones-service/Dockerfile
    container_name: m4-notificaciones
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: notificaciones-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${NOTIFICACIONES_DB_USER:-notificaciones_app}
      DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-notificaciones_pwd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-consular}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-consular}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      NOTIFICACIONES_FALLAR_SIEMPRE: ${NOTIFICACIONES_FALLAR_SIEMPRE:-false}
    ports:
      - "8084:8084"
    networks:
      - frontal
      - datos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 8

  pagos-service:
    build:
      context: .
      dockerfile: pagos-service/Dockerfile
    container_name: m4-pagos
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: pagos-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${PAGOS_DB_USER:-pagos_app}
      DB_PASSWORD: ${PAGOS_DB_PASSWORD:-pagos_pwd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-consular}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-consular}
      LATENCIA_INYECTADA_MS: ${LATENCIA_INYECTADA_MS:-0}
    ports:
      - "8083:8083"
    networks:
      - frontal
      - datos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 8

  emision-service:
    build:
      context: .
      dockerfile: emision-service/Dockerfile
    container_name: m4-emision
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: emision-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${EMISION_DB_USER:-emision_app}
      DB_PASSWORD: ${EMISION_DB_PASSWORD:-emision_pwd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-consular}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-consular}
      EMISION_SIMULAR_FALLA: ${EMISION_SIMULAR_FALLA:-false}
    ports:
      - "8087:8087"
    networks:
      - frontal
      - datos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 8

  bff-web:
    build:
      context: .
      dockerfile: bff-web/Dockerfile
    container_name: m4-bff
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: bff-web
      CITAS_SERVICE_URL: http://citas-service:8081
      TRAMITES_SERVICE_URL: http://tramites-service:8082
      PAGOS_SERVICE_URL: http://pagos-service:8083
      NOTIFICACIONES_SERVICE_URL: http://notificaciones-service:8084
      IDENTIDAD_SERVICE_URL: http://identidad-service:8086
    ports:
      - "8085:8085"
    networks:
      - frontal
      - datos
    depends_on:
      citas-service:
        condition: service_healthy
      tramites-service:
        condition: service_healthy
      pagos-service:
        condition: service_healthy
      identidad-service:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 35s
      retries: 8

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: m4-gateway
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: gateway
      CITAS_SERVICE_URL: http://citas-service:8081
      TRAMITES_SERVICE_URL: ${TRAMITES_GATEWAY_URL:-http://tramites-service:8082}
      PAGOS_SERVICE_URL: http://pagos-service:8083
      NOTIFICACIONES_SERVICE_URL: http://notificaciones-service:8084
      IDENTIDAD_SERVICE_URL: http://identidad-service:8086
      BFF_WEB_URL: http://bff-web:8085
    ports:
      - "8080:8080"
    networks:
      - frontal
      - datos
    depends_on:
      bff-web:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 35s
      retries: 8

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: m4-frontend
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MODULO: m4
      API_BASE_URL: http://localhost:8080
      FUNC_CITAS: "true"
      FUNC_TRAMITES: "true"
      FUNC_BFF: "true"
      FUNC_PAGOS: "true"
      FUNC_HISTORIAL: "true"
    ports:
      - "4200:80"
    networks:
      - frontal
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/assets/config.json >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: m4-envoy
    profiles: ["sidecar"]
    restart: unless-stopped
    mem_limit: 256m
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    ports:
      - "10000:10000"
      - "9901:9901"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - frontal
      - datos
    depends_on:
      tramites-service:
        condition: service_healthy

networks:
  frontal:
    name: m4_frontal
  datos:
    name: m4_datos

volumes:
  m4_postgres_data:
    name: m4_postgres_data
  m4_rabbitmq_data:
    name: m4_rabbitmq_data
