worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;
    sendfile      on;
    keepalive_timeout 65;

    upstream fn-consultas-up {
        server fn-consultas:8080;
    }

    upstream fn-reservar-up {
        server fn-reservar:8080;
    }

    map $request_method $citas_upstream {
        default fn-consultas-up;
        GET     fn-consultas-up;
        POST    fn-reservar-up;
        DELETE  fn-reservar-up;
    }

    map $request_method $citas_raiz_funcion {
        default consultarCita;
        GET     consultarCita;
        POST    reservarCita;
    }

    map $request_method $citas_id_funcion {
        default consultarCita;
        GET     consultarCita;
        DELETE  cancelarCita;
    }

    server {
        listen 8081;
        listen [::]:8081;
        server_name localhost;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cabeceras CORS globales para el visor Angular (localhost:4200)
        add_header Access-Control-Allow-Origin "http://localhost:4200" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With" always;
        add_header Access-Control-Expose-Headers "Location, X-Funcion-Invocada" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /actuator/health {
            proxy_pass http://fn-consultas-up/actuator/health;
        }

        location = /api/sistema/info {
            add_header Access-Control-Allow-Origin "http://localhost:4200" always;
            add_header Access-Control-Expose-Headers "Location, X-Funcion-Invocada" always;
            add_header X-Funcion-Invocada "infoSistema" always;
            proxy_pass http://fn-consultas-up/infoSistema;
        }

        location = /api/oficinas {
            add_header Access-Control-Allow-Origin "http://localhost:4200" always;
            add_header Access-Control-Expose-Headers "Location, X-Funcion-Invocada" always;
            add_header X-Funcion-Invocada "listarOficinas" always;
            proxy_pass http://fn-consultas-up/listarOficinas;
        }

        location ~ ^/api/oficinas/([^/]+)/disponibilidad$ {
            set $oficina_id $1;
            add_header Access-Control-Allow-Origin "http://localhost:4200" always;
            add_header Access-Control-Expose-Headers "Location, X-Funcion-Invocada" always;
            add_header X-Funcion-Invocada "consultarDisponibilidad" always;
            proxy_set_header Host $http_host;
            proxy_set_header X-Oficina-Id $oficina_id;
            proxy_set_header X-Fecha $arg_fecha;
            rewrite ^ /consultarDisponibilidad break;
            proxy_pass http://fn-consultas-up;
        }

        location = /api/citas {
            add_header Access-Control-Allow-Origin "http://localhost:4200" always;
            add_header Access-Control-Expose-Headers "Location, X-Funcion-Invocada" always;
            add_header X-Funcion-Invocada $citas_raiz_funcion always;
            proxy_set_header Host $http_host;
            proxy_set_header X-Dni $arg_dni;
            rewrite ^ /$citas_raiz_funcion break;
            proxy_pass http://$citas_upstream;
        }

        location ~ ^/api/citas/([^/]+)$ {
            set $cita_id $1;
            add_header Access-Control-Allow-Origin "http://localhost:4200" always;
            add_header Access-Control-Expose-Headers "Location, X-Funcion-Invocada" always;
            add_header X-Funcion-Invocada $citas_id_funcion always;
            proxy_set_header Host $http_host;
            proxy_set_header X-Cita-Id $cita_id;
            rewrite ^ /$citas_id_funcion break;
            proxy_pass http://$citas_upstream;
        }
    }
}
