server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: consular-m1-funciones-citas
  threads:
    virtual:
      enabled: true
  cloud:
    function:
      definition: ${SPRING_CLOUD_FUNCTION_DEFINITION:listarOficinas;consultarDisponibilidad;consultarCita;reservarCita;cancelarCita;notificar;infoSistema}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:consular}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: citas,notificaciones
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

consular:
  consistencia:
    modo: ${CONSISTENCIA_MODO:CP}
  notificaciones:
    canal: ${NOTIFICACIONES_CANAL:CONSOLA}
    simular-falla: ${NOTIFICACIONES_SIMULAR_FALLA:false}
  serverless:
    fn-notificar-url: ${FN_NOTIFICAR_URL:http://localhost:8080/notificar}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

