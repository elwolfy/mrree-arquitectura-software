name: m1

services:
  postgres:
    image: postgres:16-alpine
    container_name: m1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: consular
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./initdb/01-esquemas.sql:/docker-entrypoint-initdb.d/01-esquemas.sql:ro
      - m1_postgres_data:/var/lib/postgresql/data
    networks:
      - datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consular"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: m1-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - frontal
      - datos
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/livez >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: m1-frontend
    restart: unless-stopped
    mem_limit: 128m
    environment:
      API_BASE_URL: http://localhost:8081
      MODULO: m1
      FUNC_CITAS: "true"
      FUNC_TRAMITES: "false"
      FUNC_PAGOS: "false"
      FUNC_BFF: "false"
      FUNC_HISTORIAL: "false"
    ports:
      - "4200:80"
    networks:
      - frontal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/assets/config.json | grep -q apiBaseUrl || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  monolito:
    profiles: ["monolito"]
    build:
      context: .
      dockerfile: monolito-modular/Dockerfile
    container_name: m1-monolito
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      CONSISTENCIA_MODO: ${CONSISTENCIA_MODO:-CP}
      NOTIFICACIONES_CANAL: ${NOTIFICACIONES_CANAL:-CONSOLA}
      NOTIFICACIONES_SIMULAR_FALLA: ${NOTIFICACIONES_SIMULAR_FALLA:-false}
    ports:
      - "8081:8081"
    networks:
      frontal:
        gw_priority: 10
      datos:
        gw_priority: 1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  clean:
    profiles: ["clean"]
    build:
      context: .
      dockerfile: comparativa-clean/Dockerfile
    container_name: m1-clean
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      CONSISTENCIA_MODO: ${CONSISTENCIA_MODO:-CP}
      NOTIFICACIONES_CANAL: ${NOTIFICACIONES_CANAL:-CONSOLA}
      NOTIFICACIONES_SIMULAR_FALLA: ${NOTIFICACIONES_SIMULAR_FALLA:-false}
    ports:
      - "8081:8081"
    networks:
      frontal:
        gw_priority: 10
      datos:
        gw_priority: 1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  notificaciones:
    profiles: ["microservicios"]
    build:
      context: .
      dockerfile: microservicios/notificaciones-service/Dockerfile
    container_name: m1-notificaciones
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: notificaciones_app
      DB_PASSWORD: notificaciones_pwd
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      NOTIFICACIONES_CANAL: ${NOTIFICACIONES_CANAL:-CONSOLA}
      NOTIFICACIONES_SIMULAR_FALLA: ${NOTIFICACIONES_SIMULAR_FALLA:-false}
    ports:
      - "8084:8084"
    networks:
      - frontal
      - datos
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  citas:
    profiles: ["microservicios"]
    build:
      context: .
      dockerfile: microservicios/citas-service/Dockerfile
    container_name: m1-citas
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: citas_app
      DB_PASSWORD: citas_pwd
      NOTIFICACIONES_URL: http://notificaciones:8084
      NOTIFICACIONES_SIMULAR_FALLA: ${NOTIFICACIONES_SIMULAR_FALLA:-false}
    ports:
      - "8081:8081"
    networks:
      frontal:
        gw_priority: 10
      datos:
        gw_priority: 1
    depends_on:
      postgres:
        condition: service_healthy
      notificaciones:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  fn-notificar:
    profiles: ["serverless"]
    build:
      context: .
      dockerfile: serverless/funciones-citas/Dockerfile
    container_name: m1-fn-notificar
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SPRING_CLOUD_FUNCTION_DEFINITION: notificar
      NOTIFICACIONES_CANAL: ${NOTIFICACIONES_CANAL:-CONSOLA}
      NOTIFICACIONES_SIMULAR_FALLA: ${NOTIFICACIONES_SIMULAR_FALLA:-false}
    networks:
      - frontal
      - datos
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  fn-consultas:
    profiles: ["serverless"]
    build:
      context: .
      dockerfile: serverless/funciones-citas/Dockerfile
    container_name: m1-fn-consultas
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_CLOUD_FUNCTION_DEFINITION: listarOficinas;consultarDisponibilidad;consultarCita;infoSistema
    networks:
      - frontal
      - datos
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  fn-reservar:
    profiles: ["serverless"]
    build:
      context: .
      dockerfile: serverless/funciones-citas/Dockerfile
    container_name: m1-fn-reservar
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_CLOUD_FUNCTION_DEFINITION: reservarCita;cancelarCita
      FN_NOTIFICAR_URL: http://fn-notificar:8080/notificar
    networks:
      - frontal
      - datos
    depends_on:
      postgres:
        condition: service_healthy
      fn-notificar:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  enrutador:
    profiles: ["serverless"]
    build:
      context: ./serverless/enrutador
      dockerfile: Dockerfile
    container_name: m1-enrutador
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "8081:8081"
    networks:
      - frontal
    depends_on:
      fn-consultas:
        condition: service_healthy
      fn-reservar:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/sistema/info | grep -q SERVERLESS || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  k6:
    profiles: ["carga"]
    image: grafana/k6:0.54.0
    container_name: m1-k6
    volumes:
      - ../docs/pruebas/k6:/scripts:ro
    environment:
      OBJETIVO: ${OBJETIVO:-http://host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["run", "/scripts/${K6_SCRIPT:-citas.js}"]
    networks:
      - frontal

networks:
  frontal:
    name: m1_frontal
  datos:
    name: m1_datos
    internal: true

volumes:
  m1_postgres_data:
    name: m1_postgres_data

