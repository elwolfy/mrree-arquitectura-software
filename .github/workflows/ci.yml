name: CI

on:
  push:
    branches:
      - main
      - 'solucion/**'
      - 'demo/**'
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend (${{ matrix.modulo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulo:
          - m1-estilos
          - m2-integracion
          - m3-datos
          - m4-observabilidad
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar pruebas y verificación (${{ matrix.modulo }})
        run: |
          cd ${{ matrix.modulo }}
          mvn -B verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Comprobar existencia de frontend/package.json
        id: check_frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Node.js 22
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependencias
        if: steps.check_frontend.outputs.exists == 'true'
        run: |
          cd frontend
          npm ci

      - name: Lint de código
        if: steps.check_frontend.outputs.exists == 'true'
        run: |
          cd frontend
          npm run lint --if-present

      - name: Pruebas unitarias
        if: steps.check_frontend.outputs.exists == 'true'
        run: |
          cd frontend
          npm test -- --watch=false --browsers=ChromeHeadless

      - name: Compilación de producción
        if: steps.check_frontend.outputs.exists == 'true'
        run: |
          cd frontend
          npm run build
