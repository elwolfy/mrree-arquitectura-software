server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: consular-clean

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/consular?currentSchema=citas,tramites&connectTimeout=2&socketTimeout=2
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Propiedades pedagógicas del curso (sección 4.3 del contrato global)
consistencia:
  modo: ${CONSISTENCIA_MODO:CP}

notificaciones:
  canal: ${NOTIFICACIONES_CANAL:CONSOLA}
  simular-falla: ${NOTIFICACIONES_SIMULAR_FALLA:false}

